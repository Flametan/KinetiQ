name: Android APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - claude/kinetiq-fitness-app-xn3il1
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Dependencies installieren
        run: npm ci

      - name: Web-App bauen
        run: npm run build

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: Debug-APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kinetiq-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
